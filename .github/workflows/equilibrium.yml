name: Standalone equilibrium research

on:
  push:
    paths:
      - 'research/equilibrium/**'
      - '.github/workflows/equilibrium.yml'
  pull_request:
    paths:
      - 'research/equilibrium/**'
      - '.github/workflows/equilibrium.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-research:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: research/equilibrium/requirements.lock.txt
      - name: Install pinned research dependencies
        run: |
          python -m pip install -r research/equilibrium/requirements.lock.txt
          python -m pip install --no-deps -e research/equilibrium
          python -m pip check
      - name: Test equilibrium, source contracts and reports
        run: python -m pytest research/equilibrium -q --junitxml=outputs/ci-tests.xml
      - name: Build verified research bundle
        run: python -m avertiq_equilibrium bundle --output outputs/ci-research
      - name: Run verified transport prototype
        run: python -m avertiq_equilibrium transport --output outputs/ci-transport.json
      - name: Verify variable-density flow and buoyancy
        run: |
          python -m avertiq_equilibrium flow-checks --output outputs/ci-flow-checks.json
          python -m avertiq_equilibrium flow --output outputs/ci-flow.json
      - name: Verify conservative thermal and phase coupling
        run: |
          python -m avertiq_equilibrium thermal-checks --output outputs/ci-thermal-checks.json
          python -m avertiq_equilibrium thermal-flow --output outputs/ci-thermal-flow.json
          python research/equilibrium/tools/acoustic_benchmark.py --output outputs/ci-thermal-acoustic.json
      - name: Verify integrated 2D thermal buoyancy
        run: |
          python -m avertiq_equilibrium thermal2d-checks --output outputs/ci-thermal2d-checks.json
          python -m avertiq_equilibrium thermal2d --output outputs/ci-thermal2d.json
      - name: Verify open atmospheric setup
        run: |
          python -m avertiq_equilibrium atmospheric-checks --output outputs/ci-atmospheric-checks.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m avertiq_equilibrium atmospheric --output outputs/ci-atmospheric.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m avertiq_equilibrium atmospheric-refinement --output outputs/ci-atmospheric-refinement.json
      - name: Compare gas concentrations on matched physical areas
        run: python research/equilibrium/tools/receptor_refinement.py --input outputs/ci-atmospheric-refinement.json --output outputs/ci-gas-refinement.json
      - name: Refine the release aperture at fixed timestep
        run: python research/equilibrium/tools/aperture_refinement.py --output outputs/ci-aperture.json
      - name: Evaluate aperture concentration sensitivity
        run: python research/equilibrium/tools/receptor_refinement.py --input outputs/ci-aperture.json --output outputs/ci-aperture-gas.json
      - name: Save research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: standalone-research
          path: outputs/
          retention-days: 7
          if-no-files-found: error
